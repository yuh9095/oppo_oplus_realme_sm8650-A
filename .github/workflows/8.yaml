      - name: Build kernel2
        run: |
         cd kernel_workspace
         export EXTRA_KBUILD_ARGS="--//common:skip_defconfig_check=true"
         ./kernel_platform/oplus/build/oplus_build_kernel.sh pineapple gki

      - name: Make AnyKernel3
        run: |
         git clone https://github.com/Kernel‑SU/AnyKernel3 --depth=1
         rm -rf ./AnyKernel3/.git
         cp kernel_workspace/kernel_platform/out/msm‑kernel‑${{ github.event.inputs.CPUD }}‑gki/dist/Image ./AnyKernel3/
         FEIL="${{ github.event.inputs.FEIL }}"
         ZIP_NAME="AnyKernel3_${FEIL}.zip"
         cd AnyKernel3
         zip -r ../$ZIP_NAME ./*
         echo "AK3_ZIP=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload AnyKernel3
        uses: actions/upload‑artifact@v4
        with:
         name: ${{ env.AK3_ZIP }}
         path: ./${{ env.AK3_ZIP }}

      - name: Upload Image
        uses: actions/upload‑artifact@v4
        with:
         name: Image_${{ github.event.inputs.FEIL }}
         path: kernel_workspace/kernel_platform/out/msm‑kernel‑${{ github.event.inputs.CPUD }}‑gki/dist/Image

      - name: Upload all kernel build artifacts (dist full)
        uses: actions/upload‑artifact@v4
        with:
          name: Kernel_Full_Artifacts_${{ github.event.inputs.FEIL }}
          path: kernel_workspace/kernel_platform/out/msm‑kernel‑${{ github.event.inputs.CPUD }}‑gki/dist/
