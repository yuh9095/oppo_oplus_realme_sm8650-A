name: Build Kernel
on:
  workflow_dispatch:
    inputs:
      CPU:
        description: "分支"
        required: true
        default: 'sm8650'
      FEIL:
        description: "配置文件"
        required: true
        default: 'oneplus_12_v'
      CPUD:
        description: "处理器代号"
        required: true
        default: 'pineapple'
      ANDROID_VERSION:
        description: "内核安卓版本"
        required: true
        default: 'android14'
      KERNEL_VERSION:
        description: "内核版本"
        required: true
        default: '6.1'
  
      bbr_enable:
        description: '是否启用bbr算法(优化上行数据,对手机日用无太大意义甚至可能负优化;false关闭,true仅加入算法,default设为默认)'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
          - 'default'
      droidspaces_enable:
        description: '是否启用Droidspaces容器支持(轻量化的完整Linux容器支持;false关闭,standard开启容器+ntsync支持,extend开启更多测试支持项)'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'standard'
          - 'extend'
      better_net:
        description: '是否开启网络功能拓展配置(仅补充BPF流解析器,ipset相关由droidspaces配置提供)'
        required: true
        type: boolean
        default: false
      ssg_enable:
        description: '是否启用三星SSG IO调度器支持(提升IO读写性能; 在一加12上可能导致bug)'
        required: true
        type: boolean
        default: true
      baseband_guard:
        description: '是否开启内核级基带保护(阻止一切对非用户分区的写入，有效防止格机)'
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Configure Git
        run: |
         git config --global user.name "build"
         git config --global user.email "3436378798@qq.com"

      - name: Install dependencies
        run: |
         sudo apt update && sudo apt upgrade -y
         sudo apt install -y python3 git curl patch zip unzip
      - name: Install repo tool
        run: |
         curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
         chmod a+x ~/repo
         sudo mv ~/repo /usr/local/bin/repo

      - name: Initialize repo and sync
        run: |
         mkdir kernel_workspace && cd kernel_workspace
         repo init -u https://github.com/OnePlusOSS/kernel_manifest.git -b refs/heads/oneplus/${{ github.event.inputs.CPU }} -m ${{ github.event.inputs.FEIL }}.xml --depth=1
         repo sync
         rm kernel_platform/common/android/abi_gki_protected_exports_* || echo "No protected exports!"
         rm kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || echo "No protected exports!"
         sed -i 's/ -dirty//g' kernel_platform/common/scripts/setlocalversion
         sed -i 's/ -dirty//g' kernel_platform/msm-kernel/scripts/setlocalversion
  

      - name: 网络增强 better_net（仅BPF流解析器）
        if: inputs.better_net
        run: |
          cd kernel_workspace/kernel_platform/common
          echo "CONFIG_BPF_STREAM_PARSER=y" >> arch/arm64/configs/gki_defconfig

      - name: BBR拥塞控制
        run: |
          BBR_MODE=${{ github.event.inputs.bbr_enable }}
          cd kernel_workspace/kernel_platform/common
          if [[ "$BBR_MODE" != "false" ]]; then
            echo "CONFIG_TCP_CONG_ADVANCED=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_BBR=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_CUBIC=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_VEGAS=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_NV=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_WESTWOOD=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_HTCP=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_BRUTAL=y" >> arch/arm64/configs/gki_defconfig
            if [[ "$BBR_MODE" == "default" ]]; then
              echo "CONFIG_DEFAULT_TCP_CONG=bbr" >> arch/arm64/configs/gki_defconfig
            else
              echo "CONFIG_DEFAULT_TCP_CONG=cubic" >> arch/arm64/configs/gki_defconfig
            fi
          fi

      - name: Droidspaces容器支持（完整补丁 + ravindu644官方GKI配置）
        run: |
          DROID=${{ github.event.inputs.droidspaces_enable }}
          if [[ "$DROID" == "false" ]];then exit 0;fi
          cd kernel_workspace/kernel_platform/common
            # 应用 Droidspaces 容器必须补丁
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/fix_sysvipc_kabi_6_7_8.patch
            patch -p1 -F 3 < fix_sysvipc_kabi_6_7_8.patch || true
            # 修补 oplus_bsp_midas 行为，避免开机崩溃
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/fix_oplus_bsp_midas.patch
            patch -p1 -F 3 < fix_oplus_bsp_midas.patch || true
            # 应用 NTSync 补丁
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/ntsync_base.patch
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/ntsync_compat_android14-6.1.patch
            patch -p1 -F 3 < ntsync_base.patch || true
            patch -p1 -F 3 < ntsync_compat_android14-6.1.patch || true
            # 开启 Droidspaces 容器所需内核支持

          # ========== IPC ==========
          echo "CONFIG_SYSVIPC=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_POSIX_MQUEUE=y" >> arch/arm64/configs/gki_defconfig

          # ========== Namespaces ==========
          echo "CONFIG_IPC_NS=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_PID_NS=y" >> arch/arm64/configs/gki_defconfig

          # ========== HW Access Support ==========
          echo "CONFIG_DEVTMPFS=y" >> arch/arm64/configs/gki_defconfig

          # ========== Networking (Enhanced NAT support) ==========
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> arch/arm64/configs/gki_defconfig

          # --- optional but recommended ---
          # Fix for docker unsafe procfs error
          echo "CONFIG_USER_NS=y" >> arch/arm64/configs/gki_defconfig

          # IPv6 in NAT mode (NAT66)
          echo "CONFIG_IP6_NF_NAT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> arch/arm64/configs/gki_defconfig

          # UFW support
          echo "CONFIG_NETFILTER_XT_TARGET_REJECT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_TARGET_LOG=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y" >> arch/arm64/configs/gki_defconfig

          # Fail2ban support
          echo "CONFIG_IP_SET=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IP=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NET=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_SET=y" >> arch/arm64/configs/gki_defconfig

          # Enable xattr, posix acl support on tmpfs For NixOS support
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_TMPFS_XATTR=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_REKERNEL=y" >> arch/arm64/configs/gki_defconfig

          # ⚠️ WARNING: These two break GKI kABI, DO NOT ENABLE
          # echo "CONFIG_CFS_BANDWIDTH=y" >> arch/arm64/configs/gki_defconfig
          # echo "CONFIG_CGROUP_PIDS=y" >> arch/arm64/configs/gki_defconfig

          # NTSync
          echo "CONFIG_NTSYNC=y" >> arch/arm64/configs/gki_defconfig

          if [[ "$DROID" == "extend" ]]; then
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/evdi_drm.patch
            patch -p1 -F 3 < evdi_drm.patch || true
            echo "CONFIG_BT_HCIVHCI=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_STATIC_USERMODEHELPER=n" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_DRM_LINDROID_EVDI=y" >> arch/arm64/configs/gki_defconfig
          fi

      - name: SSG IO调度器
        if: inputs.ssg_enable
        run: |
          cd kernel_workspace/kernel_platform/common
          echo "CONFIG_MQ_IOSCHED_SSG=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_MQ_IOSCHED_SSG_CGROUP=y" >> arch/arm64/configs/gki_defconfig

      - name: Baseband‑guard基带保护（完整脚本）
        if: inputs.baseband_guard
        run: |
          cd kernel_workspace/kernel_platform/common
          curl -sSL https://github.com/cctv18/Baseband-guard/raw/master/setup.sh | bash
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          echo "CONFIG_BBG=y" >> arch/arm64/configs/gki_defconfig

      - name: Build kernel
        run: |
         cd kernel_workspace
         ./kernel_platform/oplus/build/oplus_build_kernel.sh pineapple gki

      - name: Make AnyKernel3
        run: |
         git clone https://github.com/Kernel-SU/AnyKernel3 --depth=1
         rm -rf ./AnyKernel3/.git
         cp kernel_workspace/kernel_platform/out/msm-kernel-${{ github.event.inputs.CPUD }}-gki/dist/Image ./AnyKernel3/
         FEIL="${{ github.event.inputs.FEIL }}"
         ZIP_NAME="AnyKernel3_${FEIL}.zip"
         cd AnyKernel3
         zip -r ../$ZIP_NAME ./*
         echo "AK3_ZIP=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
         name: ${{ env.AK3_ZIP }}
         path: ./${{ env.AK3_ZIP }}

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
         name: Image_${{ github.event.inputs.FEIL }}
         path: kernel_workspace/kernel_platform/out/msm-kernel-${{ github.event.inputs.CPUD }}-gki/dist/Image
